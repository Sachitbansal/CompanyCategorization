services:
  backend:
    build: ./backend
    ports:
      - "8006:8006"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8009:8009"
    depends_on:
      - backend
    restart: unless-stopped
